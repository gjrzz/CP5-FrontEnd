<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Bootstrap</title>
  
  <!-- Bootstrap: basta importar UM arquivo CSS e já temos classes,
  componentes e um grid system prontos, com visual definido. -->
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  >

  <style>
    :root {
      --brand-accent: #c07a3e;
    }
    .text-brand { color: var(--brand-accent); }
    .btn-brand {
      background-color: var(--brand-accent);
      color: #fff;
    }
    .btn-brand:hover {
      background-color: #a8672f;
      color: #fff;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Grão<span class="text-brand">Nobre</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="#inicio">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#depoimentos">Depoimentos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#faq">FAQ</a>
          </li>
          <li class="nav-item ms-lg-3">
            <button class="btn btn-brand" type="button" data-bs-toggle="modal" data-bs-target="#comprarModal">Comprar agora</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="modal fade" id="comprarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Faça seu pedido:</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="kitDegustacao">
            <label class="form-check-label" for="kitDegustacao">Kit de degustação</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="pacote250g">
            <label class="form-check-label" for="pacote250g">1 pacote de 250g</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="cincoPacotes250g">
            <label class="form-check-label" for="cincoPacotes250g">5 pacotes de 250g</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary">Ir para o carrinho</button>
        </div>
      </div>
    </div>
  </div>

  <section id="inicio" class="py-5">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-6">
          <h1 class="display-5 fw-bold">Café de origem, torrado com propósito.</h1>
          <p class="lead text-secondary">
            A Grão Nobre trabalha direto com pequenos produtores para levar até
            você grãos especiais, torrados em lotes pequenos toda semana.
          </p>
        </div>
        <div class="col-lg-6">
          <!-- imagem do hero entra na próxima etapa -->
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center py-3">
    Demo Bootstrap 5.3
  </footer>
  
  <!-- JS do Bootstrap (necessário importar para componentes com funcionalidades, ex: modal, navbar etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
